<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipes</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('theme'));
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0f0f11' : '#ffffff';
      }
    } catch (e) { /* no saved theme */ }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/" class="brand"><img src="icon.svg" alt="">Recipes</a>
    <a href="#/" data-tab="home" aria-label="Home"></a>
    <a href="#/search" data-tab="search" aria-label="Search"></a>
    <a href="#/favourites" data-tab="favourites" aria-label="Favourites"></a>
  </nav>
  <script src="app.js"></script>
</body>
</html>
